<!DOCTYPE html>
<html>
<head>
    <script src="https://js.puter.com/v2/"></script>
    <script>
        // خدعة إجبار المتصفح على فتح النوافذ المنبثقة
        Object.defineProperty(navigator, 'userActivation', { get: () => ({ isActive: true }) });

        function loginPuter() {
            puter.auth.signIn().then(() => {
                AndroidBridge.onLoginSuccess(puter.auth.getUsername());
            }).catch((err) => {
                AndroidBridge.onLoginError(err.message);
            });
        }

        function askPuter(message) {
            puter.ai.chat(message).then((response) => {
                AndroidBridge.onPuterResponse(response.message.content);
            }).catch((err) => {
                AndroidBridge.onPuterResponse("Error: " + err.message);
            });
        }
    </script>
</head>
<body style="background-color: #000000;"></body>
</html>
